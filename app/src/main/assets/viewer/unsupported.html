<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unknown format</title>
<link rel="stylesheet" href="app.css">
<style>
  .card {
    margin: 32px 16px;
    padding: 20px;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    color: #1E1B15;
  }
  .card h2 { margin: 0 0 8px; font-size: 18px; }
  .card .fname { font-weight: 600; word-break: break-all; }
  .card p { font-size: 14px; line-height: 1.5; }
  .as-text {
    display: block;
    width: 100%;
    margin: 18px 0 8px;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: #af2d18;
    color: #ffffff;
    font: 500 15px Roboto, -apple-system, "Segoe UI", sans-serif;
  }
  .as-text:active { background: #8a2413; }
  .card .caveat { font-size: 13px; opacity: 0.75; }

  /* Nothing here is a document, it is all chrome, so all of it turns over. */
  @media (prefers-color-scheme: dark) {
    body { background: #17130A; }
    .card { background: #221F19; color: #E7E2D9; box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
    .as-text { background: #FFB39E; color: #650B00; }
    .as-text:active { background: #E09883; }
  }
</style>
</head>
<body>
<div class="card">
  <h2>Gander doesn't recognize this format</h2>
  <p class="fname" id="fname"></p>
  <p id="hint"></p>
  <button type="button" class="as-text" id="asText" aria-describedby="caveat">View as text</button>
  <p class="caveat" id="caveat">If it isn't text, you'll see random characters.</p>
</div>
<script src="app.js"></script>
<script>
document.getElementById("fname").textContent = vwName;
var hint = document.getElementById("hint");
if (vwExt === "doc" || vwExt === "ppt") {
  hint.textContent =
    "This is a legacy Office format (." + vwExt + "). If you re-save it as ." +
    (vwExt === "doc" ? "docx" : "pptx") + ", Gander can display it.";
} else {
  // Nothing useful to add; leave the card to the action below
  hint.style.display = "none";
}

document.getElementById("asText").addEventListener("click", function () {
  location.replace(
    "text.html?name=" + encodeURIComponent(vwName) + "&ext=" + encodeURIComponent(vwExt)
  );
});
</script>
</body>
</html>
