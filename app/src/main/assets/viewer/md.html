<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown</title>
<link rel="stylesheet" href="app.css">
<style>
  body { background: #ffffff; }
  #content {
    max-width: 46em;
    margin: 0 auto;
    padding: 16px 18px 48px;
    font-size: 15px;
    line-height: 1.6;
    color: #24292f;
    word-wrap: break-word;
  }
  #content h1, #content h2 {
    border-bottom: 1px solid #d0d7de;
    padding-bottom: 0.3em;
    margin-top: 1.4em;
  }
  #content h1:first-child { margin-top: 0.2em; }
  #content a { color: #0969da; }
  #content code {
    font-family: "Roboto Mono", Menlo, monospace;
    font-size: 85%;
    background: #f0f2f4;
    padding: 0.2em 0.4em;
    border-radius: 5px;
  }
  #content pre {
    background: #f6f8fa;
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
  }
  #content pre code { background: none; padding: 0; }
  #content blockquote {
    margin: 0;
    padding: 0 1em;
    border-left: 4px solid #d0d7de;
    color: #57606a;
  }
  #content table { border-collapse: collapse; display: block; overflow-x: auto; }
  #content th, #content td { border: 1px solid #d0d7de; padding: 5px 12px; }
  #content th { background: #f6f8fa; }
  #content img { max-width: 100%; }
  #content hr { border: 0; border-top: 2px solid #d0d7de; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; }
    #content { color: #e6edf3; }
    #content h1, #content h2 { border-color: #30363d; }
    #content a { color: #4493f8; }
    #content code { background: #1f242c; }
    #content pre { background: #161b22; }
    #content blockquote { border-color: #30363d; color: #9198a1; }
    #content th, #content td { border-color: #30363d; }
    #content th { background: #161b22; }
  }
</style>
<script src="lib/marked.min.js"></script>
<script src="lib/purify.min.js"></script>
</head>
<body>
<div id="vw-status" class="vw-status">Rendering…</div>
<article id="content"></article>
<script src="app.js"></script>
<script>
vwFetchDoc("text")
  .then(function (txt) {
    var html = marked.parse(txt, { gfm: true, breaks: false });
    document.getElementById("content").innerHTML = DOMPurify.sanitize(html);
    vwStatusDone();
  })
  .catch(function (e) { vwError("Could not render this Markdown file", String(e)); });
</script>
</body>
</html>
