<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text</title>
<link rel="stylesheet" href="app.css">
<style>
  body { background: #ffffff; }
  pre {
    margin: 0;
    padding: 14px;
    font: 13px/1.5 "Roboto Mono", Menlo, monospace;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: #212121;
  }
  .more {
    margin: 0;
    padding: 4px 14px 24px;
    text-align: center;
  }
  .more p {
    margin: 0 0 10px;
    font: 13px/1.5 Roboto, -apple-system, "Segoe UI", sans-serif;
    color: #616161;
  }
  .more button {
    padding: 10px 20px;
    border: 1px solid #af2d18;
    border-radius: 8px;
    background: transparent;
    color: #af2d18;
    font: 500 15px Roboto, -apple-system, "Segoe UI", sans-serif;
  }
  .more button:active { background: #f7e4e0; }
  .more button[disabled] { opacity: 0.5; }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; }
    pre { color: #e0e0e0; }
    .more p { color: #9e9e9e; }
    .more button { border-color: #FFB39E; color: #FFB39E; }
    .more button:active { background: #3a2620; }
  }
</style>
</head>
<body>
<div id="vw-status" class="vw-status">Loading…</div>
<pre id="content"></pre>
<div class="more" id="more" hidden>
  <p id="moreNote" aria-live="polite"></p>
  <button type="button" id="moreBtn">Show more</button>
</div>
<script src="app.js"></script>
<script>
var content = document.getElementById("content");
var more = document.getElementById("more");
var moreNote = document.getElementById("moreNote");
var moreBtn = document.getElementById("moreBtn");
var doc = null;
var shown = 0;

/* Append rather than reassign textContent: the whole document would otherwise
   be reserialised on every page. */
function showPage() {
  moreBtn.disabled = true;
  return doc.next().then(function (page) {
    content.appendChild(document.createTextNode(page.text));
    shown += page.bytes;
    if (page.done) {
      more.hidden = true;
    } else {
      moreNote.textContent = "Showing the first " + vwFormatSize(shown) + " of this file.";
      more.hidden = false;
      moreBtn.disabled = false;
    }
  });
}

moreBtn.addEventListener("click", function () {
  showPage().catch(function (e) { vwError("Could not read the rest of this file", String(e)); });
});

vwOpenText()
  .then(function (d) {
    doc = d;
    return showPage();
  })
  .then(vwStatusDone)
  .catch(function (e) { vwError("Could not read this file", String(e)); });
</script>
</body>
</html>
